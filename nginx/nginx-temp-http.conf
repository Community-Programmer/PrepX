# ── TEMPORARY: HTTP-only config for Certbot bootstrapping ────────────────────
# Use this FIRST to get the SSL cert, then switch to nginx.conf (full HTTPS).

server {
    listen 80;
    server_name prepx.ezyjot.com;

    # Certbot ACME webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to Docker client while bootstrapping (so the site stays up)
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
