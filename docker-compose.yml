services:
  # ─────────────────────────────────────────────────────────────────────────
  # Client — Vite + React (served via Nginx)
  # ─────────────────────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_FASTAPI_URL: ${VITE_FASTAPI_URL:-http://localhost:8000/api}
    ports:
      - "8080:80"
    depends_on:
      - server
      - python-server
    restart: unless-stopped
    networks:
      - prepx-network

  # ─────────────────────────────────────────────────────────────────────────
  # Server — Node.js + Express + Prisma (MongoDB)
  # ─────────────────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - CLIENT_URL=http://localhost
    restart: unless-stopped
    networks:
      - prepx-network

  # ─────────────────────────────────────────────────────────────────────────
  # Python Server — FastAPI (AI features, PDF chat, LiveKit, etc.)
  # ─────────────────────────────────────────────────────────────────────────
  python-server:
    build:
      context: ./python-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./python-server/.env
    volumes:
      - python-uploads:/app/uploads
    restart: unless-stopped
    networks:
      - prepx-network

  # ─────────────────────────────────────────────────────────────────────────
  # Agent — AI Interviewer (LiveKit Agent)
  # ─────────────────────────────────────────────────────────────────────────
  agent-interviewer:
    build:
      context: ./agents
      dockerfile: Dockerfile
    env_file:
      - ./agents/.env
    environment:
      - AGENT_ENTRY=AIInterviewer/agent.py
    restart: unless-stopped
    networks:
      - prepx-network

  # ─────────────────────────────────────────────────────────────────────────
  # Agent — AI Tutor (LiveKit Agent)
  # ─────────────────────────────────────────────────────────────────────────
  agent-tutor:
    build:
      context: ./agents
      dockerfile: Dockerfile
    env_file:
      - ./agents/.env
    environment:
      - AGENT_ENTRY=AITutor/agent.py
    restart: unless-stopped
    networks:
      - prepx-network

  # ─────────────────────────────────────────────────────────────────────────
  # Agent — Career Counselor (LiveKit Agent)
  # ─────────────────────────────────────────────────────────────────────────
  agent-counselor:
    build:
      context: ./agents
      dockerfile: Dockerfile
    env_file:
      - ./agents/.env
    environment:
      - AGENT_ENTRY=CareerCounselor/agent.py
    restart: unless-stopped
    networks:
      - prepx-network

volumes:
  python-uploads:

networks:
  prepx-network:
    driver: bridge
